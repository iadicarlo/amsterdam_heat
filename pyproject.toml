[project]
name = "amsterdam-heat"
version = "0.1.0"
description = "Street-level heat stress and shade for Amsterdam from open aerial imagery, LiDAR and GPU radiation modelling"
readme = "README.md"
authors = [{ name = "Isma A. Di Carlo", email = "iadicarlo@icloud.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision",
    "numpy",
    "scipy",
    "pandas",
    "xarray",
    "netcdf4",
    "rasterio",
    "rioxarray",
    "geopandas",
    "shapely",
    "pyproj",
    "laspy[lazrs]",
    "owslib",
    "requests",
    "tqdm",
    "matplotlib",
    "pvlib",
    "gdal==3.13.3",
    "numba>=0.68.0",
    "pytz>=2026.5",
    "timezonefinder>=9.0.0",
    "solweig-gpu",
    "scikit-image>=0.26.0",
    "openpyxl>=3.1.5",
    "earthaccess>=0.19.0",
    "pystac-client>=0.9.0",
    "planetary-computer>=1.0.0",
]

[project.optional-dependencies]
ml = ["segment-geospatial", "deepforest", "timm", "segmentation-models-pytorch"]

[dependency-groups]
dev = ["jupyterlab", "ipykernel", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amsterdam_heat"]

[tool.ruff]
line-length = 100
# vendored from UMEP, kept identical to the source
extend-exclude = ["src/amsterdam_heat/umep_pet.py"]

[tool.uv.sources]
solweig-gpu = { path = "external/solweig-gpu", editable = true }


[tool.pytest.ini_options]
testpaths = ["tests"]
